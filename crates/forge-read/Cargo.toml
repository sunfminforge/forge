[package]
name = "forge-read"
version = "0.2.0"
edition = "2021"
publish = false
description = "Reads Guild's Forgejo, read-only, as plain text: one issue with its labels and every comment, a repo's issues by label and state, or its pulls with head, base and sha by label, state and head branch."

[dependencies]
serde_json = "1"
ureq = "2.12"
