name = "hand-in"
version = "0.1.0"
purpose = "Ends a task in one call instead of guild task check, then printf '…' | guild lesson, then guild task used and a look to see each took: each --check <item> --evidence <text> runs guild task check <task> <item> --evidence <text>; --lesson <text> (or --lesson - for stdin) with --role runs guild lesson --role <role> --task <task>, with --failed and each --external <kind> as given, the lesson on its stdin; every <file>#<id> named after --used (one or several) goes in one guild task used <task> call. Every part is optional, at least one is named. A lesson over 3 lines, or empty, is refused before anything is sent. Every part runs even when another is refused, and stdout says per part, under '== check <item>: recorded|refused', '== lesson: …' and '== used: …', what guild printed or why it was refused, with the fix. Exits 0 when every part was recorded, 1 when any was refused, 2 on a usage error (nothing run). It calls the guild CLI; it reimplements none of it."
usage = "hand-in <task> [--check <item> --evidence <text>]... [--role <role> --lesson <text>|- [--failed] [--external <kind>]...] [--used <file>#<id>...]..."
roles = ["flow-keeper", "rust-cli-coder", "trainer", "warden"]
