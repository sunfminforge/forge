name = "gate-head"
version = "0.1.0"
purpose = "Says in one call whether guild gate is green on exactly the worktree's HEAD tree, instead of guild gate, guild gate again and git rev-parse HEAD^{tree}: runs guild gate once in the current worktree (--slow and --remote <name> passed through), prints its whole output as it comes, then a summary block, '== gate-head', 'head commit: <sha>', 'head tree: <sha>', 'gate tree: <sha>' (the tree a reused run's line names, else the run's own when the worktree was clean at one HEAD throughout, else none), 'tree: matches HEAD' or 'tree: differs', 'worktree: clean' or 'worktree: dirty' with each path git status lists, and 'gate: green' or 'gate: failed, exit <code>'. Exits with the gate's code when it fails, 1 when green but on another tree or with a dirty worktree, 0 only when green on HEAD's tree and clean, 2 outside a git repo, with no commit, without guild on the PATH, or on a usage error, the cause and its fix on stderr. It calls guild and git and reimplements neither; it never changes the worktree or the index."
usage = "gate-head [--slow] [--remote <name>] | gate-head doctor | gate-head help [<topic>|all]"
roles = ["warden"]
