name = "apply-edits"
version = "0.1.0"
purpose = "Edits one file in one call instead of a python3 heredoc of chained str.replace: reads on stdin one or more SEARCH/REPLACE blocks ('<<<<<<< SEARCH' line, the exact old text, '=======' line, the new text, '>>>>>>> REPLACE' line; '<<<<<<< SEARCH all' replaces every match) and applies every block or none. Each search text must match byte for byte exactly once; a block that matches zero or several times writes nothing and exits 1, naming the block, its match count and the fix. On success it writes the file once and prints, per block, the changed region with line numbers ('<line>: <text>'), so no grep follows. An empty REPLACE deletes. Exits 2 on a malformed block or an unreadable file. --dry-run prints the same and writes nothing. Reading regions first is read-files' and peek's."
usage = "apply-edits <file> [--dry-run] < blocks"
roles = ["rust-cli-coder", "rust-web-coder", "trainer"]
