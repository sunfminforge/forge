[package]
name = "peek"
version = "0.2.0"
edition = "2021"
publish = false
description = "Prints each named argument under a '== <argument>' header: a file's lines numbered, only lines <from> to <to> of <path>:<from>-<to>, a directory's entries one per line with '/' after each directory, in the order named, in one call instead of cat, sed and ls."

