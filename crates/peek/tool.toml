name = "peek"
version = "0.2.0"
purpose = "Does cat, sed -n 'a,bp' and ls in one call: given any mix of files, line ranges of files (<path>:<from>-<to>, lines counted from 1, both included) and directories, prints per argument, in the order named, a '== <argument>' header, then a file's lines numbered ('<line>: <text>'), only a range's lines with their real numbers, or a directory's entries one per line, sorted, each directory with a trailing '/'. A binary file prints '(binary, N bytes)'; a missing or unreadable path, or a range it cannot print whole, prints an 'error: ' line with its fix under its header while the others still print. Exits 0 when every argument was read whole, 2 when any was not. Read-only."
usage = "peek <path>[:<from>-<to>]…"
roles = ["foreman", "rust-cli-coder", "rust-web-coder", "trainer", "warden", "flow-keeper", "ui-tester"]
