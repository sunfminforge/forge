# An external tool: installed by its recipe on the machine that runs the work, when
# the work needs it (sunfmin/control#1066). Its cargo is the formula's, at a path in
# its prefix; it builds with rustup's toolchain, which it needs (sunfmin/control#1173).
name = "cargo"
version = "2.0.0"
purpose = "Rust's cargo, the one of the formula sunfmin/tap/flux-toolchain, on rustup's toolchain"
usage = "cargo <command> [args…]"
roles = ["coder"]
gives = ["cargo"]
needs = ["rustup"]

[install]
by = "brew"
formula = "sunfmin/tap/flux-toolchain"
at = { cargo = "libexec/bin/cargo" }

[env]
CARGO_BUILD_GC_MAX_SIZE = "12 GiB"
CARGO_BUILD_GC_SHARED_MAX_SIZE = "15 GiB"
CARGO_FORK_AUTO_UPDATE = "0"
